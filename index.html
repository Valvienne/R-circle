<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radius Circle Visualizer</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: #e6e6e6;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .ui {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(20,20,20,0.9);
        border: 1px solid #444;
        padding: 14px;
        border-radius: 12px;
        backdrop-filter: blur(6px);
    }

    input {
        width: 120px;
        padding: 8px;
        margin-top: 8px;
        background: #1b1b1b;
        color: white;
        border: 1px solid #555;
        border-radius: 6px;
    }

    canvas {
        display: block;
    }

    .info {
        margin-top: 10px;
        color: #aaa;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="ui">
    <div>Circle Radius</div>
    <input type="number" id="radiusInput" value="150" min="1">

    <div class="info">
        The white dot is the center point.<br>
        Radius expands outward from it.
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const radiusInput = document.getElementById("radiusInput");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    const radius = Number(radiusInput.value);

    // Circle
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#6fb3ff";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Filled subtle glow
    ctx.fillStyle = "rgba(111, 179, 255, 0.12)";
    ctx.fill();

    // Center point
    ctx.beginPath();
    ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    // Radius line
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(centerX + radius, centerY);
    ctx.strokeStyle = "#ffffff88";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Text
    ctx.fillStyle = "#ddd";
    ctx.font = "16px Arial";
    ctx.fillText(`Radius: ${radius}`, centerX + radius / 2 - 30, centerY - 10);

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
